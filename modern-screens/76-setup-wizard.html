<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup Wizard — GSS Gonin-Gora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="padding:24px;background:var(--bg)">
  <div class="card" style="max-width:560px;margin:40px auto;padding:32px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;background:var(--navy);color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-weight:800">GG</div>
      <h2 style="font-size:1.3rem;font-weight:800;color:var(--navy)">School Setup Wizard</h2>
      <p style="color:var(--mut);font-size:0.9rem">Step 2 of 5 — Academic Structure</p>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:24px">
      <div style="flex:1;height:6px;background:#27c25a;border-radius:3px"></div>
      <div style="flex:1;height:6px;background:#1a6fe8;border-radius:3px"></div>
      <div style="flex:1;height:6px;background:#e5e7eb;border-radius:3px"></div>
      <div style="flex:1;height:6px;background:#e5e7eb;border-radius:3px"></div>
      <div style="flex:1;height:6px;background:#e5e7eb;border-radius:3px"></div>
    </div>
    <div class="form-group"><label>Current Session</label><input class="form-control" value="2025/2026"></div>
    <div class="form-group"><label>Current Term</label><select class="form-control"><option>1st Term</option><option>2nd Term</option><option>3rd Term</option></select></div>
    <div class="form-group"><label>Number of Class Levels</label><input class="form-control" type="number" value="6"></div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn btn-outline" style="flex:1">← Back</button>
      <button class="btn btn-primary" style="flex:1">Continue →</button>
    </div>
  </div>
</body>
</html>
