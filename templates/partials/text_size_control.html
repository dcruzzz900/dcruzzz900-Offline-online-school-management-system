{# V107: global text size (A- / reset / A+). Scales ALL text through the root font-size; saved per person (server) and per device (fallback). #}
<div class="fs-control btn-group btn-group-sm" role="group" aria-label="Text size">
  <button type="button" class="btn btn-secondary" data-fs-step="-1" aria-label="Decrease text size" title="Smaller text">A<sup>−</sup></button>
  <button type="button" class="btn btn-secondary fs-val" data-fs-step="0" aria-label="Reset text size" title="Reset text size"><span data-fs-label>100%</span></button>
  <button type="button" class="btn btn-secondary" data-fs-step="1" aria-label="Increase text size" title="Larger text">A<sup>+</sup></button>
</div>
