{% extends "base.html" %}
{% block title %}Parent Login{% endblock %}
{% block content %}
<div class="auth-shell"><div class="auth-card">
  <div class="brand-mark">🎓</div><h1>Parent Portal</h1><p>Stay connected to your child's academic journey.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username, email or phone<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Sign in to Parent Portal</button>
  </form>
  <p class="muted">Parent access is created by your school administrator.</p>
  <a href="{{ url_for('login') }}">Staff login</a>
</div></div>
{% endblock %}
