<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Child — Parent Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)">
  <div class="card" style="width:100%;max-width:420px;padding:32px">
    <h2 style="font-size:1.25rem;font-weight:800;color:var(--navy);margin-bottom:4px">Link a Child</h2>
    <p style="color:var(--mut);font-size:0.85rem;margin-bottom:20px">Connect your account to a student record using the school code and admission number.</p>
    <div class="form-group"><label>School Code</label><input class="form-control" value="GSS-GG"></div>
    <div class="form-group"><label>Admission Number</label><input class="form-control" placeholder="e.g. GSS/2023/0142"></div>
    <div class="form-group"><label>Student Date of Birth</label><input class="form-control" type="date"></div>
    <button class="btn btn-primary" style="width:100%">Link Child</button>
    <p style="text-align:center;margin-top:14px;font-size:0.85rem"><a href="04-parent-dashboard.html">← Back to dashboard</a></p>
  </div>
</body>
</html>
