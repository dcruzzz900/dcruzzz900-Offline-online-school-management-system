# Railway: install headless Chromium so result PDFs are printed from the SAME HTML as the print view.
[phases.setup]
aptPkgs = ["...", "libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libdrm2", "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxfixes3", "libxrandr2", "libgbm1", "libasound2", "libpango-1.0-0", "libcairo2", "fonts-liberation"]

[phases.build]
cmds = ["pip install -r requirements.txt", "PLAYWRIGHT_BROWSERS_PATH=/app/.browsers playwright install chromium"]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.browsers"
