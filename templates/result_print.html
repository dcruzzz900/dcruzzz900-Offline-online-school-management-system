<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ student_full_name(student) }} — {{ term.name }} Result</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/result-sheet.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/result-samples.css') }}">
<style>body{margin:0;background:#e9ecef}.rs-toolbar{position:sticky;top:0;display:flex;gap:8px;justify-content:center;padding:8px;background:#222}.rs-toolbar button,.rs-toolbar a{padding:8px 16px;border-radius:6px;border:0;background:#fff;color:#111;font:600 14px Arial;text-decoration:none;cursor:pointer}.rs-wrap{padding:12px 0}.rs-wrap .rs-sheet{box-shadow:0 2px 10px rgba(0,0,0,.25)}@media print{body{background:#fff}.rs-toolbar{display:none}.rs-wrap{padding:0}}
/* Page orientation: overrides result-sheet.css's portrait default when the school chose landscape. Declared last so it wins. */
@page{size:A4{{ ' landscape' if rs.page_orientation == 'landscape' else '' }};margin:0}
</style></head>
<body class="rs-print-page">
<div class="rs-toolbar no-print"><button type="button" onclick="window.print()">Print</button><a href="{{ pdf_url }}">Download PDF</a><a href="{{ back_url }}">Close</a></div>
<div class="rs-wrap">{% include "_result_sheet.html" %}</div>
<script>
/* Page & print settings, from the school's Result Display Settings:
   - RS_LANDSCAPE: the chosen page orientation for this sheet.
   - RS_FONT_SCALE: a flat zoom factor for the school's preferred print size (small/normal/large).
   - RS_FIT_TO_PAGE: whether an overflowing sheet is auto-shrunk onto one page, or left to flow onto more than one.
   One page (when Fit to Page is on): if the sheet is taller than the page, scale it down so nothing is cut off or
   pushed to a second page; otherwise (or when Fit to Page is off and it already fits) pad it to fill the page. */
var RS_LANDSCAPE = {{ (rs.page_orientation == 'landscape')|tojson }};
var RS_FONT_SCALE = {{ (rs.font_scale_factor or 1.0)|tojson }};
var RS_FIT_TO_PAGE = {{ (rs.fit_to_page if rs.fit_to_page is defined else true)|tojson }};
(function(){function fit(){var s=document.querySelector('.rs-sheet');if(!s)return;
var pageWmm=RS_LANDSCAPE?297:210,pageHmm=RS_LANDSCAPE?210:297;
s.style.zoom='';s.style.height='auto';var ow=s.style.width,ob=s.style.boxSizing;s.style.boxSizing='border-box';s.style.width=pageWmm+'mm';
var max=pageHmm*96/25.4-8;var h=s.scrollHeight;s.style.width=ow;s.style.boxSizing=ob;
var base=RS_FONT_SCALE||1,fitOn=RS_FIT_TO_PAGE!==false,overflow=(h*base)>max;
if(fitOn&&overflow){var z=Math.max(0.28,(max/h)*0.965);s.style.zoom=z;s.style.minHeight=(max/z-1)+'px';}
else{s.style.zoom=base;if(!overflow||fitOn){s.style.minHeight=(max/base-1)+'px';}}
s.style.height='';}
window.addEventListener('load',fit);window.addEventListener('beforeprint',fit);window.addEventListener('resize',fit);})();
</script>
{% if autoprint %}<script>window.addEventListener('load',function(){setTimeout(function(){window.print();},350);});</script>{% endif %}
</body></html>
