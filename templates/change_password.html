{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="width:100%;max-width:420px;margin:24px auto;padding:28px">
    <h1 style="font-size:1.25rem;font-weight:800;margin-bottom:4px">Change Password</h1>
    <p class="muted" style="font-size:.85rem;margin-bottom:16px">Update your login password</p>
    <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Current Password</label>
        <input type="password" name="current_password" required class="form-control">
        <label>New Password</label>
        <input type="password" name="new_password" required minlength="6" class="form-control">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="6" class="form-control">
        <button class="btn btn-primary" type="submit">Update Password</button>
    </form>
    <p style="text-align:center;margin:14px 0 0;font-size:.85rem"><a href="#" onclick="history.back();return false">Cancel</a></p>
</div>
{% endblock %}
