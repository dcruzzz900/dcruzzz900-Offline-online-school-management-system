# Railway: headless Chromium, so result PDFs are printed from the SAME HTML as the print view.
# `playwright install --with-deps` chooses the correct system packages for the build image's Ubuntu release
# (e.g. libasound2t64 on 24.04), so no package names are hard-coded here. If the system libraries cannot be installed the
# build still succeeds and the app falls back to the older PDF builder (see html_pdf.py).

[phases.build]
cmds = [
  "pip install -r requirements.txt",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.browsers playwright install --with-deps chromium || PLAYWRIGHT_BROWSERS_PATH=/app/.browsers playwright install chromium || true"
]

[variables]
PLAYWRIGHT_BROWSERS_PATH = "/app/.browsers"
