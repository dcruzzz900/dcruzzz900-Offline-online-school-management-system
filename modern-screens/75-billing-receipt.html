<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Receipt — GSS Gonin-Gora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="padding:24px;background:#f1f5f9">
  <div class="card" style="max-width:480px;margin:0 auto;padding:32px">
    <div style="text-align:center;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:20px">
      <div style="width:48px;height:48px;background:var(--primary);color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;font-weight:800">GG</div>
      <h2 style="font-size:1.1rem;font-weight:800;color:var(--primary)">Government Secondary School</h2>
      <p style="font-size:0.8rem;color:var(--muted)">Payment Receipt</p>
    </div>
    <div style="font-size:0.875rem;line-height:1.8">
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Receipt No</span><b>RCP-2026-0847</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Date</span><b>10 Nov 2026</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Student</span><b>Chinedu Okeke</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Class</span><b>SSS 2A</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Fee Type</span><b>Tuition (1st Term)</b></div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)"><span style="color:var(--muted)">Amount Paid</span><b style="font-size:1.2rem;color:#059669">₦120,000</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Balance</span><b>₦0</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">Status</span><span class="badge badge-green">Paid in Full</span></div>
    </div>
    <div style="margin-top:24px;display:flex;gap:10px">
      <button class="btn btn-outline" style="flex:1">Print</button>
      <button class="btn btn-primary" style="flex:1">Download PDF</button>
    </div>
  </div>
</body>
</html>
