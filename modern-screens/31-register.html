<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Registration — GSS Gonin-Gora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="card" style="width:100%;max-width:440px;padding:32px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;background:var(--primary);color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-weight:800;font-size:1.2rem">GG</div>
      <h2 style="font-size:1.3rem;font-weight:800;color:var(--primary)">Staff Self-Registration</h2>
      <p style="color:var(--muted);font-size:0.9rem">Create your teacher login</p>
    </div>
    <div class="form-group"><label>Full Name</label><input class="form-control" placeholder="e.g. Mr. A. Okafor"></div>
    <div class="form-group"><label>Username</label><input class="form-control" placeholder="Choose a username"></div>
    <div class="form-group"><label>Signup Code</label><input class="form-control" placeholder="Code from admin"></div>
    <div class="form-group"><label>Password</label><input class="form-control" type="password" placeholder="Create password"></div>
    <div class="form-group"><label>Confirm Password</label><input class="form-control" type="password"></div>
    <div class="form-group"><label>Security Question</label><select class="form-control"><option>What is your mother's maiden name?</option><option>First school attended?</option></select></div>
    <div class="form-group"><label>Answer</label><input class="form-control"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px">Create Account</button>
    <p style="text-align:center;margin-top:16px;font-size:0.85rem"><a href="01-login.html">Already have an account? Sign in</a></p>
  </div>
</body>
</html>
