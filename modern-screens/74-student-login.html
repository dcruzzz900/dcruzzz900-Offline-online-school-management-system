<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login — GSS Gonin-Gora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="card" style="width:100%;max-width:400px;padding:32px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;background:var(--primary);color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-weight:800">GG</div>
      <h2 style="font-size:1.25rem;font-weight:800;color:var(--primary)">Student Login</h2>
      <p style="color:var(--muted);font-size:0.85rem">Access your results and timetable</p>
    </div>
    <div class="form-group"><label>Admission Number</label><input class="form-control" placeholder="e.g. GSS/2023/0142"></div>
    <div class="form-group"><label>Class Login Code</label><input class="form-control" placeholder="From your class teacher"></div>
    <button class="btn btn-primary" style="width:100%">Sign In</button>
    <p style="text-align:center;margin-top:16px;font-size:0.8rem"><a href="01-login.html">Staff / Parent login →</a></p>
  </div>
</body>
</html>
