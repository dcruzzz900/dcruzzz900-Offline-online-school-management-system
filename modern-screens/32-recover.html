<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Recovery — GSS Gonin-Gora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="card" style="width:100%;max-width:420px;padding:32px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;background:var(--primary);color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-weight:800">GG</div>
      <h2 style="font-size:1.3rem;font-weight:800;color:var(--primary)">Forgot Password?</h2>
      <p style="color:var(--muted);font-size:0.9rem">Recover via security question</p>
    </div>
    <div class="form-group"><label>Username</label><input class="form-control" placeholder="Your username"></div>
    <div class="form-group"><label>Security Question</label><input class="form-control" value="What is your mother's maiden name?" disabled style="background:#f1f5f9"></div>
    <div class="form-group"><label>Your Answer</label><input class="form-control" placeholder="Enter answer"></div>
    <button class="btn btn-primary" style="width:100%">Continue</button>
    <p style="text-align:center;margin-top:16px;font-size:0.85rem"><a href="01-login.html">Back to login</a></p>
  </div>
</body>
</html>
