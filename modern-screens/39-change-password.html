<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password — GSS Gonin-Gora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px">
  <div class="card" style="width:100%;max-width:400px;padding:32px">
    <h2 style="font-size:1.25rem;font-weight:800;color:var(--primary);margin-bottom:4px">Change Password</h2>
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:20px">Update your login password</p>
    <div class="form-group"><label>Current Password</label><input class="form-control" type="password"></div>
    <div class="form-group"><label>New Password</label><input class="form-control" type="password"></div>
    <div class="form-group"><label>Confirm New Password</label><input class="form-control" type="password"></div>
    <button class="btn btn-primary" style="width:100%">Update Password</button>
    <p style="text-align:center;margin-top:14px;font-size:0.85rem"><a href="02-admin-dashboard.html">Cancel</a></p>
  </div>
</body>
</html>
