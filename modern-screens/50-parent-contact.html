<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact School — Parent Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body>
  <header class="topbar">
        <div class="topbar-school">
          <h1>Government Secondary School</h1>
          <p>Parent Portal</p>
        </div>
        <form class="topbar-search" action="72-search-results.html" method="get" role="search">
          <input type="search" name="q" placeholder="Search students, staff, classes…" aria-label="Global search">
        </form>
        <div class="topbar-actions">
          <a href="21-notifications.html" class="topbar-notif" title="Notifications" aria-label="Notifications">🔔<span class="notif-badge">2</span></a>
          <span class="role-chip">Parent</span>
          <div class="avatar">PO</div>
        </div>
      </header>
    <div class="content" style="max-width:560px;margin:0 auto">
    <div class="page-header" style="margin-top:20px">
      <div><h2>Contact School</h2><p>Send a message to the school</p></div>
    </div>
    <div class="card" style="padding:24px">
      <div class="form-group">
        <label>Regarding Child</label>
        <select class="form-control"><option>Chinedu Okeke (SSS 2A)</option><option>Adaeze Okeke (JSS 3B)</option></select>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input class="form-control" placeholder="e.g. Absence notification, Fee enquiry">
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea class="form-control" rows="5" placeholder="Write your message..."></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%">Send Message</button>
    </div>
  </div>
  <nav class="mobile-tabs" aria-label="Mobile navigation">
    <a href="04-parent-dashboard.html"><span class="tab-ico">⌂</span>Home</a>
    <a href="36-parent-result.html"><span class="tab-ico">📄</span><span class="ni">▣</span>Results</a>

    <a href="21-notifications.html"><span class="tab-ico">🔔</span>Alerts</a>
  </nav>

</html>
