<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register School — Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:#f1f5f9">
  <div class="card" style="width:100%;max-width:480px;padding:32px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;background:#7c3aed;color:white;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-weight:800">PH</div>
      <h2 style="font-size:1.3rem;font-weight:800;color:#7c3aed">Register Your School</h2>
      <p style="color:var(--muted);font-size:0.9rem">Start your free trial on My School Hub</p>
    </div>
    <div class="form-group"><label>School Name</label><input class="form-control" placeholder="e.g. Government Secondary School"></div>
    <div class="form-group"><label>Location / City</label><input class="form-control" placeholder="e.g. Abuja"></div>
    <div class="form-group"><label>Admin Full Name</label><input class="form-control"></div>
    <div class="form-group"><label>Admin Email</label><input class="form-control" type="email"></div>
    <div class="form-group"><label>Admin Phone</label><input class="form-control"></div>
    <div class="form-group"><label>Password</label><input class="form-control" type="password"></div>
    <button class="btn btn-primary" style="width:100%;background:#7c3aed">Create School Account</button>
    <p style="text-align:center;margin-top:16px;font-size:0.85rem"><a href="01-login.html">Already registered? Sign in</a></p>
  </div>
</body>
</html>
